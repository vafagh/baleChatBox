; تنظیمات بله
PLG_SYSTEM_BALE_CHAT_BALE_SETTINGS="پیکربندی بله"
PLG_SYSTEM_BALE_CHAT_BALE_USERNAME="نام کاربری ربات بله (برای پیوند مستقیم)"
PLG_SYSTEM_BALE_CHAT_BALE_USERNAME_DESC="نام کاربری ربات پشتیبانی بله شما (مثال: my_support_bot). برای پیوند مستقیم چت استفاده می‌شود. نحوه دریافت: 1) به https://bale.ai بروید 2) حساب تجاری ایجاد یا وارد شوید 3) یک ربات جدید از داشبورد ایجاد کنید 4) به تنظیمات ربات بروید 5) نام کاربری را کپی کنید (بدون @)"
PLG_SYSTEM_BALE_CHAT_BALE_TOKEN="توکن API ربات بله"
PLG_SYSTEM_BALE_CHAT_BALE_TOKEN_DESC="توکن API ربات بله برای فرم تماس. نحوه دریافت: 1) داشبورد تجاری https://bale.ai را بازدید کنید 2) ربات خود را انتخاب کنید 3) به تنظیمات ربات یا بخش API بروید 4) توکن API/کلید را کپی کنید (معمولا رشته‌ای طولانی از حروف و اعداد)"
PLG_SYSTEM_BALE_CHAT_BALE_CHAT_ID="شناسه چت بله"
PLG_SYSTEM_BALE_CHAT_BALE_CHAT_ID_DESC="شناسه چت بله که پیام‌ها برای آن ارسال می‌شوند. نحوه دریافت: 1) بله را باز کنید و یک پیام برای ربات خود ارسال کنید 2) به https://api.bale.io/botTOKEN_SHOMA/getUpdates بروید 3) شناسه 'chat' را در پاسخ جستجو کنید (مقدار عددی)"

; تنظیمات تلگرام
PLG_SYSTEM_BALE_CHAT_TELEGRAM_SETTINGS="پیکربندی تلگرام"
PLG_SYSTEM_BALE_CHAT_TELEGRAM_USERNAME="نام کاربری ربات تلگرام (برای پیوند مستقیم)"
PLG_SYSTEM_BALE_CHAT_TELEGRAM_USERNAME_DESC="نام کاربری ربات تلگرام برای بازگشت (مثال: my_support_bot). برای پیوند مستقیم چت استفاده می‌شود. نحوه دریافت: 1) تلگرام را باز کنید 2) @BotFather را جستجو کنید 3) دستور /start ارسال کنید 4) دستور /newbot ارسال کنید 5) دستورات را دنبال کنید تا ربات ایجاد شود 6) BotFather نام کاربری ربات را ارسال می‌کند (بدون @)"
PLG_SYSTEM_BALE_CHAT_TELEGRAM_TOKEN="توکن API ربات تلگرام"
PLG_SYSTEM_BALE_CHAT_TELEGRAM_TOKEN_DESC="توکن API ربات تلگرام برای فرم تماس. نحوه دریافت: 1) @BotFather را در تلگرام پیام دهید 2) ربات خود را با دستور /mybots انتخاب کنید 3) گزینه ویرایش ربات را انتخاب کنید 4) گزینه 'توکن API' را انتخاب کنید 5) توکن را کپی کنید (قالب: 123456:ABCDEFghijklmnopqrstuvwxyz)"
PLG_SYSTEM_BALE_CHAT_TELEGRAM_CHAT_ID="شناسه چت تلگرام"
PLG_SYSTEM_BALE_CHAT_TELEGRAM_CHAT_ID_DESC="شناسه گروه/چت تلگرام که پیام‌ها برای آن ارسال می‌شوند. نحوه دریافت: 1) ربات خود را به یک گروه یا چت اضافه کنید 2) پیامی ارسال کنید 3) به https://api.telegram.org/botTOKEN_SHOMA/getUpdates بروید 4) شناسه 'chat' را در پاسخ جستجو کنید (عدد منفی برای گروه‌ها)"


PLG_SYSTEM_BALE_CHAT_BALE_SETTINGS="پیکردنی بله"
PLG_SYSTEM_BALE_CHAT_BALE_USERNAME="ناوی بەکارهێنەری بۆتی بله (بۆ بەستەری بێوتانی)"
PLG_SYSTEM_BALE_CHAT_BALE_USERNAME_DESC="ناوی بەکارهێنەری بۆتی پاڵپشتی بله‌ت (مثال: my_support_bot). بۆ بەستەری بێوتانی چات بەکاردێت. چۆن دەست بکەویت: 1) بڕۆ https://bale.ai 2) ئەژمۆنی بازرگانی دروست بکە یان چوون 3) بۆتی نوێ دروست بکە 4) بڕۆ ڕێکخستنەکانی بۆت 5) ناوی بەکارهێنەر کۆپی بکە (بەبێ @)"
PLG_SYSTEM_BALE_CHAT_BALE_TOKEN="تۆکنی API ی بۆتی بله"
PLG_SYSTEM_BALE_CHAT_BALE_TOKEN_DESC="تۆکنی API ی بۆتی بله بۆ فۆڕمی پەیوەندی. چۆن دەست بکەویت: 1) سێشاننامەی بازرگانی https://bale.ai سەردان بکە 2) بۆتی خۆت هەڵبژێرە 3) بڕۆ ڕێکخستنەکانی بۆت یان بەشی API 4) تۆکنی API/کلید کۆپی بکە (بەزۆری رشتەیەکی درێژ)"
PLG_SYSTEM_BALE_CHAT_BALE_CHAT_ID="ناسنامەی چاتی بله"
PLG_SYSTEM_BALE_CHAT_BALE_CHAT_ID_DESC="ناسنامەی چاتی بله کە پەیامەکان بۆی دەنێردرێن. چۆن دەست بکەویت: 1) بله بکەرەوە و پەیامێک بۆ بۆتی خۆت بنێرە 2) بڕۆ https://api.bale.io/botTOKEN_KHOWT/getUpdates 3) ناسنامەی 'chat' بگەڕێ لە وەڵام (بڕیاری ژمارە)"

; ڕێکخستنەکانی تێلێگرام
PLG_SYSTEM_BALE_CHAT_TELEGRAM_SETTINGS="پیکردنی تێلێگرام"
PLG_SYSTEM_BALE_CHAT_TELEGRAM_USERNAME="ناوی بەکارهێنەری بۆتی تێلێگرام (بۆ بەستەری بێوتانی)"
PLG_SYSTEM_BALE_CHAT_TELEGRAM_USERNAME_DESC="ناوی بەکارهێنەری بۆتی تێلێگرام بۆ گەڕاندنەوە (مثال: my_support_bot). بۆ بەستەری بێوتانی چات بەکاردێت. چۆن دەست بکەویت: 1) تێلێگرام بکەرەوە 2) @BotFather بگەڕێ 3) فرمان /start بنێرە 4) فرمان /newbot بنێرە 5) ڕێنماییەکان پەیڕۆ بکە بۆ دروستکردنی بۆت 6) BotFather ناوی بەکارهێنەری بۆت دەناردنێت (بەبێ @)"
PLG_SYSTEM_BALE_CHAT_TELEGRAM_TOKEN="تۆکنی API ی بۆتی تێلێگرام"
PLG_SYSTEM_BALE_CHAT_TELEGRAM_TOKEN_DESC="تۆکنی API ی بۆتی تێلێگرام بۆ فۆڕمی پەیوەندی. چۆن دەست بکەویت: 1) @BotFather ری پەیام بدە لە تێلێگرام 2) بۆتی خۆت بە فرمانی /mybots هەڵبژێرە 3) گۆڕینی بۆت هەڵبژێرە 4) گۆڕینی 'تۆکنی API' هەڵبژێرە 5) تۆکن کۆپی بکە (فۆڕمات: 123456:ABCDEFghijklmnopqrstuvwxyz)"
PLG_SYSTEM_BALE_CHAT_TELEGRAM_CHAT_ID="ناسنامەی چاتی تێلێگرام"
PLG_SYSTEM_BALE_CHAT_TELEGRAM_CHAT_ID_DESC="ناسنامەی کۆمەڵە/چاتی تێلێگرام کە پەیامەکان بۆی دەنێردرێن. چۆن دەست بکەویت: 1) بۆتی خۆت زیاد بکە بۆ کۆمەڵە یان چات 2) پەیامێک بنێرە 3) بڕۆ https://api.telegram.org/botTOKEN_KHOWT/getUpdates 4) ناسنامەی 'chat' بگەڕێ لە وەڵام (ژمارەی نیشانی کاتێک بۆ کۆمەڵەکان)"

